# Lint settings for the Python that remains: the model server
# (model-space/, which needs PyTorch) and the browser smoke test (scripts/).
target-version = "py312"
line-length = 88

[lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = [
    # Nepali text in strings and comments is intentional.
    "RUF001",
    "RUF003",
]
