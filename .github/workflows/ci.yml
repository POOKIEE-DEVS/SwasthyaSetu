# Lint + build + test for each service, on every push and pull request.
# Jobs are independent so one service's failure doesn't hide another's result.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (Python / FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check app tests alembic
      - name: Format check (ruff)
        run: ruff format --check app tests
      - name: Test (pytest)
        run: pytest

  migrations:
    name: Migrations (Alembic)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: swasthyasetu
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: swasthyasetu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U swasthyasetu -d swasthyasetu"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://swasthyasetu:ci-only-password@localhost:5432/swasthyasetu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      # A migration that cannot be applied is not a schema, it is a draft.
      - name: Apply migrations
        run: alembic upgrade head
      # Reverting must restore an empty database, including the enum types --
      # otherwise a re-upgrade fails with "type already exists".
      - name: Revert migrations
        run: alembic downgrade base
      - name: Re-apply from empty
        run: alembic upgrade head
      # Models and migrations must agree: a non-empty autogenerate diff means
      # someone changed a model without writing the migration for it.
      - name: Check models match migrations
        run: |
          alembic check

  frontend:
    name: Frontend (Next.js PWA)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Typecheck (tsc)
        run: npm run typecheck
      - name: Build
        run: npm run build

  compose:
    name: Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Catches a malformed compose file without paying for a full stack build.
      - name: Validate compose file
        run: docker compose config --quiet
