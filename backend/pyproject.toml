# Tooling configuration. Dependencies live in requirements*.txt.

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = [
    # FastAPI dependency injection uses call defaults.
    "B008",
    # Nepali text in strings and comments is intentional.
    "RUF001",
    "RUF003",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
