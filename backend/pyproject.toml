# Tooling configuration. Dependencies live in requirements.txt /
# requirements-dev.txt so the Docker build can install them without
# installing the application as a package.

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear
    "UP",   # pyupgrade
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",  # ruff-specific
]
ignore = [
    # FastAPI's dependency injection is expressed as function-call defaults;
    # this rule fights the framework rather than catching real bugs.
    "B008",
]

[tool.ruff.lint.isort]
# The local `alembic/` directory otherwise makes ruff classify the
# installed `alembic` package as first-party.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# Re-exports are the point of these modules.
# __all__ is grouped tables-then-enums, which reads better than one
# alphabetical run of eighteen names.
"app/models/__init__.py" = ["F401", "RUF022"]
"app/db/base.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:app.*"]
