# Run the production image locally:
#
#   cp backend/.env.example backend/.env   # fill in HF_SPACE_ID etc.
#   docker compose up --build
#   open http://localhost:8000
#
# Camera and mic work on localhost. A second laptop needs HTTPS, which means
# the deployed version (docs/deployment.md).

name: swasthyasetu

services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: backend/.env
        required: false
    # These win over backend/.env, whose values are for running outside
    # Docker (e.g. STATIC_DIR=../frontend/out would not exist in the image).
    environment:
      STATIC_DIR: /app/static
      ENVIRONMENT: production
      CORS_ORIGINS: ""
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
