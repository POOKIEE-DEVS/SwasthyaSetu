# Render Blueprint: one web service built from the root Dockerfile.
# Render dashboard -> New -> Blueprint -> pick this repo. The secrets below
# are prompted for on first deploy. See docs/deployment.md.

services:
  - type: web
    name: swasthyasetu
    runtime: docker
    dockerfilePath: ./Dockerfile
    # "free" sleeps after 15 min idle (the first visit then takes ~1 min and
    # drops any open call). Switch to "starter" for demo day.
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: HF_SPACE_ID
        sync: false
      - key: HF_TOKEN
        sync: false
      # TURN relay: fill in ONE option and leave the other empty.
      # Static credentials (e.g. ExpressTURN's free plan):
      - key: TURN_URLS
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
      # Or Cloudflare Realtime TURN (needs a card on file):
      - key: CLOUDFLARE_TURN_KEY_ID
        sync: false
      - key: CLOUDFLARE_TURN_API_TOKEN
        sync: false
      # Accounts, verification and chat history: a Postgres connection
      # string (Neon or Supabase). Without it they are lost on restart.
      - key: DATABASE_URL
        sync: false
      # Sign in with Google: the OAuth client from Google Cloud Console.
      # Its redirect URI is https://<this service>/api/v1/auth/google/callback
      # (Render's RENDER_EXTERNAL_URL supplies the host automatically).
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Google account email(s) of the admin who reviews applications.
      - key: ADMIN_EMAILS
        sync: false
